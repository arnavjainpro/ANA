appId: com.ana.desktop
productName: Ana
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
# node-pty ships a native binary — it must stay unpacked from the asar so the
# OS loader can dlopen/LoadLibrary it at runtime.
asarUnpack:
  - '**/node_modules/node-pty/**'
mac:
  target:
    - dmg
  category: public.app-category.developer-tools
win:
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
protocols:
  - name: Ana
    schemes:
      - ana
